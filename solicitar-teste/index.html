<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar teste | Nexodent</title><style>body{font:16px system-ui;background:#f6f7fa;color:#273042;margin:0}main{max-width:480px;margin:7vh auto;background:white;padding:30px;border-radius:16px;box-shadow:0 6px 35px #0001}img{width:55px}h1{margin:8px 0}label{display:block;margin:14px 0 5px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd0d9;border-radius:8px;font:inherit}button{background:#f57921;color:white;border:0;border-radius:8px;padding:14px 18px;font-weight:bold;margin-top:20px;cursor:pointer}#message{margin-top:16px}small{color:#667085}</style></head><body><main><img src="/assets/img/nexodent-symbol.png" alt="Nexodent"><h1>Solicitar teste gratuito</h1><p>Envie seus dados. O acesso será liberado somente após análise e aprovação.</p><form id="request"><label>Seu nome</label><input name="nome" required minlength="3" maxlength="120"><label>Nome da clínica</label><input name="clinica" required minlength="3" maxlength="150"><label>E-mail</label><input name="email" type="email" required maxlength="254"><label>WhatsApp</label><input name="whatsapp" type="tel" required minlength="8" maxlength="30"><button type="submit">Enviar solicitação</button></form><p id="message" role="status"></p><small>Não é necessário informar senha nesta etapa. Os 15 dias começarão apenas após a liberação do acesso.</small></main><script src="/assets/js/supabase/config.js"></script><script src="/solicitar-teste/request.js"></script></body></html>
