<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativar teste | Nexodent</title><style>body{font:16px system-ui;background:#f6f7fa;color:#273042}main{max-width:450px;margin:6vh auto;padding:28px;background:#fff;border-radius:15px}label{display:block;margin:12px 0}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd0d9;border-radius:7px}button{padding:12px;background:#f57921;color:white;border:0;border-radius:7px;margin:8px 4px 8px 0;cursor:pointer}#message{white-space:pre-wrap}</style></head><body><main><h1>Ativar teste Nexodent</h1><p>Use o mesmo e-mail da solicitação aprovada. Se ainda não tiver conta, cadastre-se e confirme o e-mail recebido.</p><label>Nome<input id="nome" autocomplete="name"></label><label>E-mail<input id="email" type="email" autocomplete="email"></label><label>Senha (mínimo 8 caracteres)<input id="senha" type="password" minlength="8"></label><button id="register">Criar conta</button><button id="enter">Entrar e ativar</button><p id="message" role="status"></p></main><script src="/assets/js/supabase/config.js"></script><script src="/assets/js/supabase/client.js"></script><script src="/ativar-teste/activate.js"></script></body></html>
