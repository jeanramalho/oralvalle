<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Oral Valle" />
    <meta name="theme-color" content="#ff7a00" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Consultório – Pacientes</title>
               <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/legacy-1.css" />
    <link rel="stylesheet" href="./assets/css/legacy-2.css" />
    <link rel="stylesheet" href="./assets/css/legacy-3.css" />
    <link rel="stylesheet" href="./assets/css/cloud.css" />
    <style>
      #ov-startup-shell{position:fixed;inset:0;z-index:9000;background:#1c1f20;color:#fff;font-family:Figtree,Arial,sans-serif;overflow:hidden}
      #ov-startup-shell[hidden]{display:none}
      .ov-startup-header{height:78px;background:#c96a00;display:flex;align-items:center;gap:14px;padding:0 30px}
      .ov-startup-header strong{font-size:23px}.ov-startup-header small{font-size:13px;opacity:.9}
      .ov-startup-layout{display:flex;height:calc(100% - 78px)}.ov-startup-sidebar{width:260px;flex-shrink:0;border-right:1px solid #383d3f;padding:24px 18px}
      .ov-startup-sidebar span{display:block;height:15px;width:80%;margin:18px 0;background:#303537;border-radius:5px}
      .ov-startup-sidebar span:nth-child(2n){width:64%}.ov-startup-content{padding:28px;flex:1;min-width:0}
      .ov-startup-title{height:28px;width:200px;background:#34393b;border-radius:6px;margin-bottom:25px}
      .ov-startup-panel{border:1px solid #353b3d;border-radius:12px;padding:24px;margin-bottom:18px;max-width:1050px}
      .ov-startup-panel div{height:22px;border-radius:5px;background:#2b3032;margin:12px 0;width:85%}
      .ov-startup-panel div:nth-child(2){width:65%}.ov-startup-panel div:nth-child(3){width:74%}
      @media(max-width:700px){.ov-startup-header{height:72px;padding:0 18px}.ov-startup-header strong{font-size:19px}.ov-startup-header small{display:none}.ov-startup-layout{height:calc(100% - 72px)}.ov-startup-sidebar{display:none}.ov-startup-content{padding:20px}}
    </style>
  </head>
  <body>
    <!-- Interface visual neutra durante a autenticação: nenhum dado clínico é exibido antes da autorização. -->
    <div id="ov-startup-shell" aria-label="Abrindo Oral Valle">
      <header class="ov-startup-header"><strong>◡ &nbsp; ORALVALLE</strong><small>Clínica Odontológica</small></header>
      <div class="ov-startup-layout"><aside class="ov-startup-sidebar" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></aside>
        <section class="ov-startup-content" aria-hidden="true"><div class="ov-startup-title"></div><div class="ov-startup-panel"><div></div><div></div><div></div></div><div class="ov-startup-panel"><div></div><div></div></div></section>
      </div>
    </div>
    <main id="app"></main>
    <div id="printarea"></div>
    <!-- Scripts clássicos mantêm a abertura local, sem servidor ou compilação. -->
    <script defer src="./assets/js/state.js"></script>
    <script defer src="./assets/js/utils.js"></script>
    <script defer src="./assets/js/storage.js"></script>
    <script defer src="./assets/js/auth.js"></script>
    <script defer src="./assets/js/calculations.js"></script>
    <script defer src="./assets/js/features/dashboard.js"></script>
    <script defer src="./assets/js/features/reminders.js"></script>
    <script defer src="./assets/js/features/patients.js"></script>
    <script defer src="./assets/js/features/treatments.js"></script>
    <script defer src="./assets/js/features/prescriptions.js"></script>
    <script defer src="./assets/js/features/certificates.js"></script>
    <script defer src="./assets/js/features/budget-documents.js"></script>
    <script defer src="./assets/js/features/budget-print.js"></script>
    <script defer src="./assets/js/features/pdf.js"></script>
    <script defer src="./assets/js/features/catalogs.js"></script>
    <script defer src="./assets/js/features/dentists.js"></script>
    <script defer src="./assets/js/features/appointments.js"></script>
    <script defer src="./assets/js/features/sales.js"></script>
    <script defer src="./assets/js/features/commissions.js"></script>
    <script defer src="./assets/js/features/backup.js"></script>
    <script defer src="./assets/js/features/actions.js"></script>
    <script defer src="./assets/js/features/payments.js"></script>
    <script defer src="./assets/js/features/events.js"></script>
    <script defer src="./assets/js/features/notifications.js"></script>
    <script defer src="./assets/js/permissions.js"></script>
    <script defer src="./assets/js/supabase/config.js"></script>
    <script defer src="./assets/js/supabase/client.js"></script>
    <script defer src="./assets/js/supabase/data.js"></script>
    <script defer src="./assets/js/supabase/integration.js"></script>
    <script defer src="./assets/js/features/cloud-files.js"></script>
    <script defer src="./assets/js/app.js"></script>
  </body>
</html>
